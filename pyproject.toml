[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "valkyrie"
version = "0.2.0"
description = "All-in-One Data Contract Enforcement Engine powered by DuckDB SQL Single-Pass"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "duckdb>=1.0.0",
    "pyyaml>=6.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "polars>=1.0.0",
    "pyiceberg>=0.7.0",
]

[project.scripts]
valkyrie = "valkyrie.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/valkyrie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
